name: Crimson Desert Schedule Timeline

on:
  # steam_topseller_history.json이 갱신되는 워크플로우 뒤에 자동으로 이어서 실행
  workflow_run:
    workflows: ["Steam Top Seller Tracker"]
    types:
      - completed
  # 위 트리거를 못 탈 경우를 대비한 안전망 (6시간마다)
  schedule:
    - cron: '15 0,6,12,18 * * *'
  # 수동 실행
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crimson-desert-schedule-timeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run으로 트리거된 경우, 앞선 워크플로우가 성공했을 때만 실행
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
      # build_schedule_analysis.py / render_html.py는 표준 라이브러리만 사용 — pip install 불필요

    - name: Build combined schedule JSON
      run: python build_schedule_analysis.py

    - name: Render HTML dashboard
      run: python render_html.py

    - name: Commit and Push changes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        TRACKED_FILES=(
          crimson_desert_schedule_analysis.json
          steam_rank_timeline.html
        )

        # 1. 결과물을 임시 디렉터리에 백업 (push 실패해도 보존)
        mkdir -p /tmp/schedule_timeline_backup
        for f in "${TRACKED_FILES[@]}"; do
          [ -f "$f" ] && cp "$f" "/tmp/schedule_timeline_backup/$f"
        done

        # 2. 서버 최신 상태로 rebase (충돌 방지)
        for f in "${TRACKED_FILES[@]}"; do
          git checkout -- "$f" 2>/dev/null || true
        done
        git pull origin main --rebase || {
          echo "⚠️ rebase 실패, abort 후 일반 pull 시도"
          git rebase --abort 2>/dev/null || true
          git pull origin main --no-rebase
        }

        # 3. 결과물(백업본)을 최신 repo 위에 덮어쓰기
        for f in "${TRACKED_FILES[@]}"; do
          if [ -f "/tmp/schedule_timeline_backup/$f" ]; then
            cp "/tmp/schedule_timeline_backup/$f" "$f"
            echo "  복원: $f"
          fi
        done

        # 4. 변경된 파일만 add → commit → push
        for f in "${TRACKED_FILES[@]}"; do
          [ -f "$f" ] && git add "$f" || true
        done

        git diff --cached --quiet && { echo "변경사항 없음, 스킵"; exit 0; }

        git commit -m "Update schedule timeline [skip ci]"

        # 5. push 실패 시 재시도 1회 (race condition 대비)
        git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main || {
          echo "⚠️ push 실패, pull 후 재시도"
          git pull origin main --rebase
          for f in "${TRACKED_FILES[@]}"; do
            [ -f "/tmp/schedule_timeline_backup/$f" ] && cp "/tmp/schedule_timeline_backup/$f" "$f"
            [ -f "$f" ] && git add "$f" || true
          done
          git commit --amend --no-edit 2>/dev/null || true
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main
        }

        echo "✅ 완료!"
