name: PS Store Rank Tracker

on:
  schedule:
    - cron: "0 * * * *"   # 매시 정각 (UTC 기준). 필요에 맞게 조정하세요.
  workflow_dispatch:
    inputs:
      concept_id:
        description: "PS Store concept ID"
        required: false
        default: "10002363"

env:
  CONCEPT_ID: ${{ github.event.inputs.concept_id || '10002363' }}

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager pandas tabulate

      - name: Run rank tracker
        run: |
          python ps_rank_tracker.py --concept-id "$CONCEPT_ID" --workers 4 \
            --out data/rank_$(date -u +%Y%m%d_%H%M).csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "chore: update PS rank data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
