name: 붉은사막 DLC 사전예약 추적

on:
  schedule:
    - cron: '20 23,1,2,3,4,5,6,7,8,11 * * *'
    - cron: '50 1,2,3,4,5,6,7,8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crimson-dlc-rank-history
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Setup Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install selenium webdriver-manager requests matplotlib

    - name: Run DLC Tracker
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        python crimson_dlc_tracker.py

    - name: Commit and Push changes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        TRACKED_FILES=(
          crimson_dlc_rank_history.json
          crimson_dlc_discord_baseline.json
        )

        mkdir -p /tmp/dlc_tracker_backup
        for f in "${TRACKED_FILES[@]}"; do
          [ -f "$f" ] && cp "$f" "/tmp/dlc_tracker_backup/$f"
        done
        echo "✅ 백업 완료"

        for f in "${TRACKED_FILES[@]}"; do
          git checkout -- "$f" 2>/dev/null || true
        done
        git pull origin main --rebase || {
          echo "⚠️ rebase 실패, abort 후 일반 pull 시도"
          git rebase --abort 2>/dev/null || true
          git pull origin main --no-rebase
        }

        for f in "${TRACKED_FILES[@]}"; do
          if [ -f "/tmp/dlc_tracker_backup/$f" ]; then
            cp "/tmp/dlc_tracker_backup/$f" "$f"
            echo "  복원: $f"
          fi
        done

        for f in "${TRACKED_FILES[@]}"; do
          [ -f "$f" ] && git add "$f" || true
        done

        git diff --cached --quiet && { echo "변경사항 없음, 스킵"; exit 0; }

        git commit -m "Update Crimson Desert DLC tracker history [skip ci]"

        git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main || {
          echo "⚠️ push 실패, pull 후 재시도"
          git pull origin main --rebase
          for f in "${TRACKED_FILES[@]}"; do
            [ -f "/tmp/dlc_tracker_backup/$f" ] && cp "/tmp/dlc_tracker_backup/$f" "$f"
            [ -f "$f" ] && git add "$f" || true
          done
          git commit --amend --no-edit 2>/dev/null || true
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main
        }

        echo "✅ 완료!"
